name: Incident
description: Something is broken for users. Open this as soon as you acknowledge the alert.
title: "INC: <what users see>"
labels: ["type:incident"]
body:
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - "SEV1: product down for everyone"
        - "SEV2: major feature broken or very slow"
        - "SEV3: minor problem, workaround exists"
    validations:
      required: true
  - type: input
    id: started
    attributes:
      label: Started (time and timezone)
      placeholder: "14:05 EST"
    validations:
      required: true
  - type: input
    id: roles
    attributes:
      label: Incident commander and helpers
      placeholder: "IC: @alice · comms: @bob"
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: What users see
      placeholder: "502 errors on every request to /api."
    validations:
      required: true
  - type: textarea
    id: timeline
    attributes:
      label: Timeline
      description: Add a line every time something happens. Keep updating it as comments.
      value: |
        - HH:MM alert fired:
        - HH:MM acknowledged by
    validations:
      required: true
  - type: textarea
    id: resolution
    attributes:
      label: Resolution
      description: Fill in when it's fixed. Then write the postmortem within 2 class days.
